name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: End-to-end run is reproducible, with no API keys
        run: |
          python scripts/run_day1.py
          python scripts/run_day2.py
          python scripts/run_day3.py
          python scripts/run_day5.py
          python scripts/run_day6.py

      # The report is regenerated to prove the generator works against real
      # artifacts. It is deliberately NOT diffed against the committed copy:
      # floating-point output can differ in the last decimal across the Python
      # matrix, and a red badge for a numerically irrelevant reason is worse
      # than no check at all.
      - name: Report regenerates from artifacts
        run: |
          python scripts/run_day4.py
          python scripts/build_report.py
