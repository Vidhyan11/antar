[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "antar"
version = "0.1.0"
description = "Incrementality-native payment recovery. Only the difference counts."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Day 5-6: the causal core.
causal = [
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "causalml>=0.14",
    "scipy>=1.10",
    "statsmodels>=0.14",
]
# Day 3: Razorpay test-mode integration.
payments = [
    "razorpay>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = ["antar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
